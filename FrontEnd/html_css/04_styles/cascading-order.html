<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>External & Inline Style 실습</title>
    <!-- External Style : 우선순위 => 가장 낮음(3) -->
    <link rel = "stylesheet" type="text/css" href="./external.css"/>
    <!-- Internal Style : 우선순위 => 두번째로 높음(2) -->
    <style type="text/css">
        #header{
            background-color: #ff00ff;
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div id="header">
        Header 영역
        <p class="header--logo">
            asd
        </p>
    </div>
    <div id="main-container" style="background-color: #000000; color: #ffffff;">
        Main-Contanier 영역
        <p class="main-container--content">
            로고 영역입니다
        </p>
    </div>
    <div id="footer">
        Footer 영역
        <ul class="footer-links">
            <li class="footer-links--links">item1</li>
            <li class="footer-links--links">item2</li>
            <li class="footer-links--links">item3</li>
        </ul>
    </div>
    
</body>
</html>
