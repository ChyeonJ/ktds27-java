<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <!-- 마인타입 text/css-->
    <style type="text/css">
        div {
            color:red;
            font-size: 12px;
        }

        p{
            font-size: 24px;
            font-weight: 100;
        }

        span{
            background-color: yellow;
            color: red;
            font-weight: 900;
            text-decoration: underline;
        }

        h1{
            color: pink;
        }

        h2{
            color: palegoldenrod;
        }

        h3, h4, h5, h6 {
            color: cyan;
        }

    </style>
</head>
<body>
   <div>영역을 나눵</div> 
   <div>눵나을역영</div>
   
   <p>단락을 만들자!</p>
   <p>란닥을 자들만</p>

   <span>조강종</span>
   <span>강조조종</span>

   <h1>1</h1>
   <h2>2</h2>
   <h3>3</h3>
   <h4>4</h4>
   <h5>5</h5>
   <h6>6</h6>
</body>
</html>
