<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="./18_forms.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="grid">
      <label for="email">이메일</label>
      <input id="email" type="email" />

      <label for="user-password">비밀번호</label>
      <input id="user-password" type="password" />

      <label for="male">성별</label>
      <div>
        <input type="radio" name="gender" id="male" />
        <label for="male">남</label>
        <input type="radio" name="gender" id="female" />
        <label for="female">여</label>
      </div>

      <label>가입경로</label>
      <div>
        <input type="checkbox" name="channel" id="instargram" />
        <label for="instargram">인스타그램</label>
        <input type="checkbox" name="channel" id="twiter" />
        <label for="twiter">트위터</label>
        <input type="checkbox" name="channel" id="facebook" />
        <label for="facebook">페이스북</label>
      </div>

      <label for="jobs">직업</label>
      <select id="jabs">
        <option>(선택)</option>
        <option>관련산업 종사자</option>
        <option>일반인</option>
        <option>학생</option>
        <option>기타</option>
      </select>

      <label for="other">하고 싶은 말</label>
      <textarea id="other"></textarea>
    </div>
  </body>
</html>
