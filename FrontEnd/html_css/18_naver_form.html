<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="./18_naver_form.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="form">
        <div class="basic-info">
          <div class="border"><label for="user-id">i</label></div>
          <input type="text" id="user-id" placeholder="아이디" />
          <span>@naver.com</span>

          <label for="user-password">p</label>
          <input type="password" id="user-password" placeholder="비밀번호" />
          <span></span>

          <label for="user-email">m</label>
          <input
            type="email"
            id="user-email"
            placeholder="[선택] 이메일주소(비밀번호 찾기 등 본인 확인용)"
          />
          <span></span>
        </div>
        <div class="personal-info">
          <label for="user-name">n</label>
          <input type="text" id="user-name" placeholder="이름" />

          <label for="user-birth">d</label>
          <input type="text" id="user-birth" placeholder="생년월일 8자리" />

          <label for="user-telcom" aria-placeholder="통신사 선택">tc</label>
          <select form="user-telcom">
            <option>통신사</option>
            <option>KT</option>
            <option>SKT</option>
            <option>LG U+</option>
            <option>SKT 알뜰폰</option>
            <option>KT 알뜰폰</option>
            <option>LG U+ 알뜰폰</option>
          </select>
          <div class="ttt">
            <div class="aa">
              <input type="radio" name="gender" id="male" />
              <label for="male">남</label>
              <input type="radio" name="gender" id="female" />
              <label for="female">여</label>
            </div>
            <div class="bb">
              <input type="radio" name="human" id="in-human" />
              <label for="in-human">내국인</label>
              <input type="radio" name="human" id="out-human" />
              <label for="out-human">외국인</label>
            </div>
          </div>
        </div>
        <div class="tel-info">
          <label for="tel">t</label>
          <input type="tel" placeholder="휴대전화번호" />
        </div>
        <div class="agreement-info">
          <label for="agree">a</label>
          <input type="checkbox" />
          <input type="text" readonly placeholder="인증 약관 전체동의" />
        </div>
      </div>
    </div>
  </body>
</html>
