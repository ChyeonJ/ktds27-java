<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Table</title>
    <link rel="styleSheet" type="text/css" href="./12_table.css" />
  </head>
  <body>
    <table class="grid">
      <!-- 사이즈를 채우기위한 목적 -->
      <colgroup>
        <!-- 첫번째 칸의 넓이는 100이다 -->
        <col width="100px" />
        <col width="" />
        <col width="100px" />
        <col width="160px" />
        <col width="160px" />
      </colgroup>
      <!-- 테이블 분류 -->
      <thead>
        <tr>
          <th>ID</th>
          <th>과제명</th>
          <th>제출마감일</th>
          <th>등록일</th>
          <th>수정일</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>47</td>
          <td>MDN CLONE</td>
          <td>2026-03-16</td>
          <td>2026-0311 17:00:00</td>
          <td>2026-0311 17:00:00</td>
        </tr>
        <tr>
          <td>47</td>
          <td>MDN CLONE</td>
          <td>2026-03-16</td>
          <td>2026-0311 17:00:00</td>
          <td>2026-0311 17:00:00</td>
        </tr>
        <tr>
          <td>47</td>
          <td>MDN CLONE</td>
          <td>2026-03-16</td>
          <td>2026-0311 17:00:00</td>
          <td>2026-0311 17:00:00</td>
        </tr>
      </tbody>

      <!-- 잘 쓰이지 않음 -->
      <tfoot></tfoot>
    </table>
    <table class="grid">
      <thead>
        <tr>
          <th rowspan="2">수강생</th>
          <th colspan="2">확정</th>
        </tr>
        <tr>
          <th>회사명</th>
          <th>입사일</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>김아무개</td>
          <td>나아무개</td>
          <td>박아무개</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
