<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Overflow</title>
    <link rel="styleSheet" type="text/css" href="./11_overflow.css" />
  </head>
  <body>
    <div>
      <div class="inline-box">
        <img src="./dddd.jpg" />
      </div>
      <div class="inline-box overflow">
        <img src="./qqqq.jpg" />
      </div>
    </div>
    <ul class="list">
      <li
        title="asd asd as asdas asd asd asd asd asd as das dasd asd as dasd asd as das"
      >
        <!-- 띄어쓰기가 있다면 띄어쓰기를 기준으로 줄바꿈 처리를한다 -->
        asd asd as asdas asd asd asd asd asd as das dasd asd as dasd asd as das
      </li>
      <!-- 띄어쓰기가 없어서 white-space가 동작하지 않음 -->
      <li title="ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd">
        ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      </li>
      <li>avc</li>
    </ul>
  </body>
</html>
