# 콘솔 로그 레벨 변경
#logging:
#  level:
#    root: debug

# spring.application.name=hello-spring



# Spring 이외의 Custome 설정
app:
  jwt:
    issuer: hello-spring
    # jwt 데이터를 암호화 시키는 것이기 때문에 유추할 수 없는 데이터를 사용한다 (43글자)
    secret-key: spring-security-secret-key-random-token-key

# mybatis 연동 설정
mybatis:
  # mybatis 설정 파일 위치 지정.
  config-location: classpath:mybatis-config.xml
  # mapper 파일들의 위치 지정.
  mapper-locations: classpath:com/ktdsuniversity/edu/**/mapper/*Mapper.xml

spring:
  security:
    oauth2:
      client:
        # 개인정보를 조회 요청 하기 위해 인증 절차를 거치는 설정
        registration:
          # 요청하는 oauth 서비스를 식별할 수 있는 이아디 작성. (정해진게 아니고, 암거나 가능)
          google:
            client-id: 989123527387-vv39f4jup45s0lfaq54n2ia6dr6ps2h5.apps.googleusercontent.com
            client-secret: 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
            client-name: GOOGLE
            scope: profile,email
          # 요청하는 oauth 서비스를 식별할 수 있는 이아디 작성. (정해진게 아니고, 암거나 가능)
          naver: 
            # 인증 아이디와 인증 키 설정
            client-id: Cdh4fDy6flUaRC2Uo5mi #naverClientID
            client-secret: skCsFu7AVX #naverPassword
            # naver oauth를 구분지을 이름 (코드)
            client-name: NAVER
            # 사용자로부터 받아올 데이터 설정
            scope: name,emai
            # 사용자의 네이버 로그인 인증 방식
            authorization-grant-type: authorization_code
            # 사용자의 네이버 로그인 콜백URL 지정 (네이버 로그인의 결과)
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
        # 인증 절차를 거친 이후 요청한 개인 정보를 받아오는 설정
        provider:
          naver:
            # oauth token 취득 URL
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            # 로그인한 회원의 개인 정보취득
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # naver 전용 (oauth2를 통한 개인정보의 취득 결과는 JSON으로 반환. {email:"", name:""})
            # naver는 {response: {email:"", name:""}}
            # 개인 정보 취득 결과가 들어있는 json Key를 설정
            user-name-attribute: response
  servlet:
    multipart: # 파일업로드 정책 설정. 용량 정책
      # Spring Server가 한번에 받을 수 있는 최대 용량
      max-file-size: 150MB
      # 파일 업로드를 할 수 있는 최대 용량
      max-request-size: 50MB
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    driver-class-name: oracle.jdbc.driver.OracleDriver
    username: SPRING_BOOT
    password: 1234
  application:
    name: hello-spring

